# Analysis parameters. Sample selection lives in config/samples.csv (`use` column).
project:
  name: gse193688_multiome
  data_dir: GSE193688_RAW

# Overridable per run: results/scale/nXX, data/processed/scale/nXX, ...
results_dir: results
processed_dir: data/processed

samples:
  sheet: config/samples.csv
  # used | all  — build the consensus peak set from the samples in this run
  # (using `all` on a 2-sample pilot would add ~30 donors' worth of structural zeros)
  consensus_from: used

qc:
  min_features_rna: 200
  max_features_rna: 6000
  min_counts_rna: 500
  max_percent_mt: 5
  min_counts_atac: 1000
  doublets:
    enabled: true
    max_doublet_rate: 0.10

peaks:
  min_width: 20
  max_width: 10000
  min_cells: 10

features:
  rna:
    method: sct_residuals      # sct_residuals | modelGeneVar
    n: 2000
    min_fraction: 0.05
  atac:
    method: tfidf_binarized_variance
    n: 2000
    min_fraction: 0.05         # required in BOTH groups, not just overall
  # feature lists are always derived from real_fit only (no holdout leakage)
  fit_on: real_fit
  # Optional: copy these feature lists instead of re-selecting. Used by the
  # scaling series so N is not confounded with feature-set drift. Empty = select.
  fixed_from: ""

cluster:
  resolution: 0.8
  n_hvg: 3000
  dims_rna: 30
  dims_atac: 30              # LSI 1 is depth-correlated and is dropped
  integrate: harmony         # harmony | none (embedding only; stats use raw counts)
  map: config/celltype_map.csv
  # Scaling runs re-cluster at every N, so the manual gate cannot be used.
  # true -> src/auto_annotate.py scores clusters on a canonical marker panel.
  auto_annotate: false
  # log2 enrichment below this is flagged low-confidence (not dropped)
  auto_min_score: 0.0

split:
  holdout_fraction: 0.30
  seed: 20261110
  stratify_by: [celltype, donor]

simulation:
  family_use: nb
  copula: gaussian
  mu_formula: "celltype + condition + celltype:condition"
  sigma_formula: "1"
  corr_formula: "1"
  n_cores: 2
  seeds: [101, 202, 303, 404, 505]
  # null = match the holdout's celltype x donor composition
  match_composition: true

hypothesis:
  enabled: true
  contrasts: [celltype, condition]
  sim_modes: [alt, null]
  de_tests: [wilcox]           # add deseq2_pseudobulk once >=3 donors/group
  target_fdr: [0.01, 0.05, 0.1, 0.2]

evaluation:
  models: [logistic_regression, random_forest]
  cv_folds: 5
  transfer_label: celltype
  controls: [positive_control, naive_poisson]
  # needs >=2 donors per condition; stays off while condition == donor
  utility: false

reversal:
  enabled: true
  source: PD
  target: Aged
  label: "C16007 (Aged) vs P02284 (PD) - donor contrast"
  model: "celltype + condition + celltype:condition"
  min_cells_per_stratum: 100
  methods: [model_delta, classifier_contribution]
  controls: [reverse_direction, permuted_condition]
  poc: true
  poc_min_cells: 30
  poc_top_n: 100
  poc_permutations: 10

dashboard:
  port: 8501
  artifacts: results

# ---------------------------------------------------------------- scaling ----
# Nested donor series used to show how the statistics change with sample size.
scaling:
  enabled: false
  cohort: [Aged, PD]          # Young is excluded (2-level condition model)
  steps: [2, 8, 16, 24]
  seed: 20261111
  # Anchored in every step so each set is a superset of the pilot.
  anchor_donors: [C16007, P02284]
  # One-time ingest over the largest set; steps subset these matrices.
  full_dir: results/scale/full
  root: results/scale
  # Largest step whose feature selection is reused by smaller steps.
  fixed_feature_step: 24

# ------------------------------------------------------- cell-type impact ----
impact:
  enabled: true
  fdr: 0.05
  min_cells_per_stratum: 30
  cv_folds: 5

# ----------------------------------------------------- synthetic utility ----
utility:
  enabled: true
  label: condition          # condition | celltype
  min_train: 100
  folds: 3
  seeds: [101, 202, 303]
  synthetic_sizes: [500, 1000, 2000, 5000, 10000]
  donor_holdout_fraction: 0.34

# ------------------------------------------------- subtype transfer ----
# k=2 subclustering inside the two disease-impacted cell types, then a
# synthetic <-> real subtype-transfer test in RNA and ATAC.
subtype:
  enabled: false
  celltypes: [Oligodendrocyte, Microglia]
  modalities: [rna, atac]
  k: 2
  n_features: 1000
  dims: 30
  seed: 20261112
  fraction: 0.30
  max_doublet_score: 0.3
  min_cells_per_donor: 10
  min_cells_per_subtype: 50
  family_use: nb
  mu_formula_alt: "subtype + condition"
  seeds: [101, 202, 303, 404, 505]
  modes: ["alt", "null", "null_zero"]
  max_cells: 20000
  models: [logistic_regression, random_forest]
  max_train: 10000
  max_test: 10000
  min_stratum: 20
